<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>電脳闘魚 '99 // CYBER BETTA 1999</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070312;
      --case-base: #180f2d;
      --case-border: #ff2a85;
      --neon-pink: #ff1493;
      --neon-magenta: #e024c3;
      --neon-cyan: #00f3ff;
      --neon-purple: #9b4dff;
      --neon-gold: #ffbe0b;
      --neon-green: #00f59b;
      --crt-border: #281a49;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(155, 77, 255, 0.18), transparent 70%),
        linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 20, 147, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Корпус консоли */
    .tamagotchi-case {
      width: 100%;
      max-width: 490px;
      background: linear-gradient(170deg, #2a164d 0%, #170d2c 50%, #0c0617 100%);
      border: 3px solid var(--neon-cyan);
      border-radius: 44px 44px 56px 56px;
      padding: 22px 18px 28px;
      box-shadow: 
        0 0 35px rgba(0, 243, 255, 0.35),
        inset 0 3px 6px rgba(255, 255, 255, 0.25),
        inset 0 -10px 20px rgba(0, 0, 0, 0.9),
        0 25px 50px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    /* Японская ретро-шапка */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 6px;
    }

    .brand-title {
      font-size: 10px;
      color: var(--neon-cyan);
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-shadow: 0 0 10px var(--neon-cyan);
    }

    .brand-title .kanji {
      font-family: 'DotGothic16', sans-serif;
      font-size: 14px;
      color: var(--neon-pink);
      text-shadow: 0 0 10px var(--neon-pink);
    }

    .top-controls {
      display: flex;
      gap: 8px;
    }

    .mini-btn {
      background: #251343;
      border: 1px solid var(--neon-magenta);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(224, 36, 195, 0.4);
      transition: all 0.15s;
    }

    .mini-btn:hover {
      background: var(--neon-magenta);
      color: #000;
      box-shadow: 0 0 14px var(--neon-magenta);
    }

    /* Экран аквариума */
    .screen-bezel {
      background: #05040a;
      padding: 12px;
      border-radius: 24px;
      border: 2px solid var(--crt-border);
      box-shadow: inset 0 0 20px #000;
      position: relative;
    }

    .crt-screen {
      position: relative;
      background: #020712;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(0, 243, 255, 0.4);
      box-shadow: inset 0 0 40px rgba(0, 18, 40, 0.9);
    }

    /* ЭЛТ Сканлайны и мерцание */
    .crt-screen::before {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 3px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.65;
    }

    .crt-screen::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at 50% 50%, transparent 65%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 11;
    }

    canvas {
      display: block;
      width: 100%;
      height: 270px;
      cursor: pointer;
    }

    /* Бегущая строка статуса */
    .status-ticker {
      font-family: 'DotGothic16', monospace;
      font-size: 13px;
      color: var(--neon-gold);
      background: #05030f;
      border: 1px solid rgba(255, 190, 11, 0.3);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 12px;
      text-align: center;
      text-shadow: 0 0 8px var(--neon-gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Панель параметров */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 14px;
      background: rgba(13, 7, 26, 0.85);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid #3c1e6e;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 8px;
      color: #bfa8e6;
      display: flex;
      justify-content: space-between;
    }

    .stat-bar-outer {
      height: 9px;
      background: #090314;
      border: 1px solid #482386;
      border-radius: 5px;
      overflow: hidden;
      padding: 1px;
    }

    .stat-bar-inner {
      height: 100%;
      width: 80%;
      border-radius: 3px;
      transition: width 0.35s ease, background 0.3s;
      box-shadow: 0 0 8px currentColor;
    }

    /* Аркадные кнопки управления */
    .controls-panel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 18px;
    }

    .action-btn {
      background: linear-gradient(180deg, #381a63 0%, #1e093d 100%);
      border: 2px solid var(--neon-pink);
      border-radius: 16px;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 #110424, 0 0 12px rgba(255, 20, 147, 0.35);
      transition: transform 0.06s, box-shadow 0.06s;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #110424, 0 0 18px var(--neon-pink);
    }

    .btn-icon {
      font-size: 22px;
      line-height: 1;
    }

    .btn-title {
      font-size: 7px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .btn-clean { border-color: var(--neon-cyan); box-shadow: 0 5px 0 #022033, 0 0 12px rgba(0, 243, 255, 0.35); }
    .btn-clean:active { box-shadow: 0 1px 0 #022033; }

    .btn-play { border-color: var(--neon-green); box-shadow: 0 5px 0 #023020, 0 0 12px rgba(0, 245, 155, 0.35); }
    .btn-play:active { box-shadow: 0 1px 0 #023020; }

    .btn-light { border-color: var(--neon-gold); box-shadow: 0 5px 0 #332703, 0 0 12px rgba(255, 190, 11, 0.35); }
    .btn-light:active { box-shadow: 0 1px 0 #332703; }

    /* Модальное окно авторизации */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 2, 10, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #15092a;
      border: 2px solid var(--neon-cyan);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.4);
    }

    .modal-header {
      font-size: 11px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.6;
    }

    .modal-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #090414;
      border: 1px solid #432279;
      color: #9c88be;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      border-radius: 8px;
    }

    .tab-btn.active {
      background: #2b1353;
      border-color: var(--neon-pink);
      color: #fff;
      box-shadow: 0 0 10px var(--neon-pink);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 8px;
      color: #baa2e3;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: #080314;
      border: 1px solid #57299a;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 12px var(--neon-cyan);
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: linear-gradient(90deg, #ff1493, #9b4dff);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(255, 20, 147, 0.7);
    }

    .auth-error {
      color: #ff3366;
      font-size: 8px;
      margin-top: 12px;
      text-align: center;
      display: none;
    }

    .hidden { display: none !important; }
    .night-filter { filter: brightness(0.4) saturate(1.4) hue-rotate(15deg); }
  </style>
</head>
<body>

  <div class="tamagotchi-case">
    <!-- Верхний блок -->
    <div class="brand-header">
      <div class="brand-title">
        <span class="kanji">電脳闘魚 '99 // ベタ</span>
        <span>NEO BETTA SYSTEM</span>
      </div>
      <div class="top-controls">
        <button id="soundToggle" class="mini-btn">🔊 BGM</button>
        <button id="profileBtn" class="mini-btn">👤 PILOT</button>
      </div>
    </div>

    <!-- Аквариум -->
    <div class="screen-bezel">
      <div class="crt-screen" id="crtScreen">
        <canvas id="aquariumCanvas" width="460" height="280"></canvas>
      </div>
    </div>

    <!-- Информационная бегущая строка -->
    <div class="status-ticker" id="statusMessage">
      ベタは優雅に泳いでいます // НЕОНОВЫЙ ПЕТУШОК ГРАЦИОЗНО ПЛАВАЕТ
    </div>

    <!-- Показатели здоровья -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">
          <span>СЫТОСТЬ (FOOD)</span>
          <span id="hungerVal">85%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="hungerBar" style="width: 85%; background: var(--neon-pink);"></div>
        </div>
      </div>
      
      <div class="stat-item">
        <div class="stat-label">
          <span>ЧИСТОТА (AQUA)</span>
          <span id="cleanVal">90%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="cleanBar" style="width: 90%; background: var(--neon-cyan);"></div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-label">
          <span>РАДОСТЬ (JOY)</span>
          <span id="joyVal">75%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="joyBar" style="width: 75%; background: var(--neon-magenta);"></div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-label">
          <span>ЭНЕРГИЯ (NRG)</span>
          <span id="energyVal">100%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="energyBar" style="width: 100%; background: var(--neon-green);"></div>
        </div>
      </div>
    </div>

    <!-- Пульт взаимодействия -->
    <div class="controls-panel">
      <button class="action-btn" id="feedBtn">
        <span class="btn-icon">🍙</span>
        <span class="btn-title">КОРМ</span>
      </button>

      <button class="action-btn btn-clean" id="cleanBtn">
        <span class="btn-icon">🫧</span>
        <span class="btn-title">ФИЛЬТР</span>
      </button>

      <button class="action-btn btn-play" id="playBtn">
        <span class="btn-icon">🪞</span>
        <span class="btn-title">ЗЕРКАЛО</span>
      </button>

      <button class="action-btn btn-light" id="sleepBtn">
        <span class="btn-icon">💡</span>
        <span class="btn-title">РЕЖИМ</span>
      </button>
    </div>
  </div>

  <!-- Терминал идентификации -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <div class="modal-header">
        CYBER-NET IDENT v1.99<br>
        <span style="font-size: 8px; color: var(--neon-pink);">[ РЕГИСТРАЦИЯ ХОЗЯИНА ПЕТУШКА ]</span>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn active" id="tabLogin">ВХОД</button>
        <button class="tab-btn" id="tabRegister">РЕГИСТРАЦИЯ</button>
      </div>

      <form id="authForm">
        <div class="form-group">
          <label class="form-label">ПОЗЫВНОЙ (USERNAME)</label>
          <input type="text" class="form-input" id="authUsername" required maxlength="12" placeholder="TOKYO_PILOT">
        </div>
        
        <div class="form-group">
          <label class="form-label">НЕО-КОД (PASSWORD)</label>
          <input type="password" class="form-input" id="authPassword" required minlength="3" placeholder="••••">
        </div>

        <button type="submit" class="submit-btn" id="authSubmit">ПОДКЛЮЧИТЬСЯ</button>
        <div class="auth-error" id="authError">ОШИБКА ДОСТУПА</div>
      </form>
    </div>
  </div>

  <script>
    /* ========================================================
       1. 8-БИТНЫЙ АУДИОСИНТЕЗАТОР (DENDY / CHIP-SOUND)
       ======================================================== */
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'square', duration = 0.08, rampTo = null) {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (rampTo) {
            osc.frequency.exponentialRampToValueAtTime(rampTo, this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
      }
      soundEat() {
        this.playTone(320, 'triangle', 0.09, 640);
        setTimeout(() => this.playTone(640, 'square', 0.1, 960), 80);
      }
      soundClean() {
        this.playTone(900, 'sine', 0.06, 1400);
        setTimeout(() => this.playTone(1400, 'sine', 0.08, 1800), 60);
      }
      soundFlare() {
        this.playTone(400, 'sawtooth', 0.08, 800);
        setTimeout(() => this.playTone(800, 'square', 0.15, 1200), 70);
      }
      soundLight() {
        this.playTone(250, 'triangle', 0.12, 100);
      }
      soundFanfare() {
        [440, 554, 659, 880].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'square', 0.09), i * 90);
        });
      }
    }
    const audio = new RetroAudio();

    /* ========================================================
       2. АККАУНТЫ И СОХРАНЕНИЕ
       ======================================================== */
    let currentUser = null;
    let authMode = 'login';

    function loadUsers() {
      return JSON.parse(localStorage.getItem('cyberbetta_users') || '{}');
    }
    function saveUsers(u) {
      localStorage.setItem('cyberbetta_users', JSON.stringify(u));
    }

    const authModal = document.getElementById('authModal');
    const authForm = document.getElementById('authForm');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authError = document.getElementById('authError');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const authSubmit = document.getElementById('authSubmit');
    const profileBtn = document.getElementById('profileBtn');

    tabLogin.onclick = () => {
      authMode = 'login';
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      authSubmit.innerText = 'ПОДКЛЮЧИТЬСЯ';
      authError.style.display = 'none';
    };

    tabRegister.onclick = () => {
      authMode = 'register';
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      authSubmit.innerText = 'ЗАРЕГИСТРИРОВАТЬ';
      authError.style.display = 'none';
    };

    authForm.onsubmit = (e) => {
      e.preventDefault();
      const u = authUsername.value.trim().toUpperCase();
      const p = authPassword.value;
      const users = loadUsers();

      if (authMode === 'register') {
        if (users[u]) {
          authError.innerText = 'ИМЯ УЖЕ ЗАНЯТО!';
          authError.style.display = 'block';
          return;
        }
        users[u] = { password: p, petState: createDefaultPet() };
        saveUsers(users);
        login(u);
      } else {
        if (!users[u] || users[u].password !== p) {
          authError.innerText = 'НЕВЕРНЫЙ ПОЗЫВНОЙ ИЛИ ПАРОЛЬ';
          authError.style.display = 'block';
          return;
        }
        login(u);
      }
    };

    function login(username) {
      currentUser = username;
      profileBtn.innerText = `👤 ${username.substring(0, 6)}`;
      authModal.classList.add('hidden');
      loadPet();
      audio.soundFanfare();
      setMessage(`ПЕТУШОК ПРИВЕТСТВУЕТ ВАС, ${username}! // 接続完了`);
    }

    profileBtn.onclick = () => authModal.classList.remove('hidden');

    function createDefaultPet() {
      return {
        hunger: 85,
        cleanliness: 90,
        happiness: 80,
        energy: 100,
        sleeping: false
      };
    }

    const pet = createDefaultPet();

    function savePet() {
      if (!currentUser) return;
      const users = loadUsers();
      if (users[currentUser]) {
        users[currentUser].petState = { ...pet };
        saveUsers(users);
      }
    }

    function loadPet() {
      if (!currentUser) return;
      const users = loadUsers();
      if (users[currentUser]?.petState) {
        Object.assign(pet, users[currentUser].petState);
        applySleepMode(pet.sleeping);
        updateUI();
      }
    }

    const statusMessage = document.getElementById('statusMessage');
    function setMessage(msg) {
      statusMessage.innerText = msg;
    }

    function updateUI() {
      document.getElementById('hungerVal').innerText = `${Math.round(pet.hunger)}%`;
      document.getElementById('cleanVal').innerText = `${Math.round(pet.cleanliness)}%`;
      document.getElementById('joyVal').innerText = `${Math.round(pet.happiness)}%`;
      document.getElementById('energyVal').innerText = `${Math.round(pet.energy)}%`;

      document.getElementById('hungerBar').style.width = `${pet.hunger}%`;
      document.getElementById('cleanBar').style.width = `${pet.cleanliness}%`;
      document.getElementById('joyBar').style.width = `${pet.happiness}%`;
      document.getElementById('energyBar').style.width = `${pet.energy}%`;
    }

    // Системный цикл жизни
    setInterval(() => {
      if (!currentUser) return;
      if (!pet.sleeping) {
        pet.hunger = Math.max(0, pet.hunger - 0.7);
        pet.cleanliness = Math.max(0, pet.cleanliness - 0.4);
        pet.happiness = Math.max(0, pet.happiness - 0.5);
        pet.energy = Math.max(0, pet.energy - 0.3);
      } else {
        pet.energy = Math.min(100, pet.energy + 2.5);
        pet.hunger = Math.max(0, pet.hunger - 0.2);
      }

      if (pet.hunger < 25) {
        setMessage('ПЕТУШОК ПРОСИТ КОРМА // お腹が空いています');
      } else if (pet.cleanliness < 25) {
        setMessage('ВОДА ПОМУТНЕЛА! ЗАПУСТИТЕ ФИЛЬТР // 水質低下');
      }

      updateUI();
      savePet();
    }, 2800);

    /* ========================================================
       3. ДВИЖОК РОСКОШНОЙ РЫБКИ-ПЕТУШКА (BETTA SPLENDENS)
       ======================================================== */
    const canvas = document.getElementById('aquariumCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = 460;
    canvas.height = 280;

    let foods = [];
    let bubbles = [];

    // Планктон и пузырьки
    for(let i=0; i<18; i++) {
      bubbles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 0.7 + 0.3
      });
    }

    // Физическая модель позвоночника петушка (Inverse Kinematics / Spine)
    const spineSegments = 8;
    const segmentLength = 5.5;
    const spine = [];
    for(let i=0; i<spineSegments; i++) {
      spine.push({ x: 230 - i * segmentLength, y: 140, angle: 0 });
    }

    const betta = {
      x: 230,
      y: 140,
      targetX: 230,
      targetY: 140,
      vx: 0,
      vy: 0,
      angle: 0,
      wiggleTime: 0,
      flareFactor: 0, // Эффект распушения плавников (0 - покой, 1 - максимальный веер)
      isFlaring: false,
      flairTimer: 0
    };

    // Брожение петушка по аквариуму
    setInterval(() => {
      if (pet.sleeping) {
        betta.targetX = canvas.width * 0.5;
        betta.targetY = canvas.height * 0.75;
        return;
      }
      if (foods.length > 0) {
        betta.targetX = foods[0].x;
        betta.targetY = foods[0].y;
      } else {
        betta.targetX = 60 + Math.random() * (canvas.width - 120);
        betta.targetY = 50 + Math.random() * (canvas.height - 100);
      }
    }, 2200);

    // Функция отрисовки шлейфового шелкового плавника (Halfmoon/Crowntail Betta Fin)
    function drawFlowingBettaFin(ctx, points, colorStart, colorMid, colorEdge, flare, finRays = 7) {
      ctx.save();
      
      // Мягкое неоновое свечение шелка
      ctx.shadowBlur = 12 * (1 + flare * 0.4);
      ctx.shadowColor = colorStart;

      // Создаем градиент для переливающегося плавника
      const grad = ctx.createLinearGradient(points[0].x, points[0].y, points[points.length-1].x, points[points.length-1].y);
      grad.addColorStop(0, colorStart);
      grad.addColorStop(0.5, colorMid);
      grad.addColorStop(1, colorEdge);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      // Отрисовка внешней плавной дуги плавника с помощью кривых Безье
      for (let i = 1; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.closePath();
      ctx.fill();

      // Неоновые лучи плавника (характерная текстура бойцовой рыбки)
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.5)';
      for (let r = 0; r < finRays; r++) {
        const idx = Math.floor((points.length / finRays) * r);
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[idx].x, points[idx].y);
        ctx.stroke();
      }

      ctx.restore();
    }

    // Полная отрисовка рыбки-петушка со всеми его королевскими плавниками
    function drawBettaFish() {
      const flare = betta.flareFactor;
      const t = betta.wiggleTime;

      // Голова и тело петушка
      const head = spine[0];
      const tail = spine[spineSegments - 1];

      // 1. РОСКОШНЫЙ ХВОСТОВОЙ ПЛАВНИК (Великолепный веер Halfmoon)
      const tailSpread = (1.4 + flare * 0.8);
      const tailLength = 55 + flare * 15;
      const caudalPoints = [{ x: tail.x, y: tail.y }];

      const tailRaysCount = 12;
      for (let i = -tailRaysCount/2; i <= tailRaysCount/2; i++) {
        const rayAngle = tail.angle + Math.PI + (i / tailRaysCount) * tailSpread;
        // Волнообразное колыхание ткани хвоста
        const wave = Math.sin(t * 3.5 - Math.abs(i) * 0.6) * 6;
        const dist = tailLength + Math.sin(Math.abs(i) * 0.4) * 14;
        
        caudalPoints.push({
          x: tail.x + Math.cos(rayAngle) * dist + Math.cos(tail.angle) * wave,
          y: tail.y + Math.sin(rayAngle) * dist + Math.sin(tail.angle) * wave
        });
      }
      caudalPoints.push({ x: tail.x, y: tail.y });

      // Отрисовываем хвост петушка в два прозрачных слоя для эффекта струящегося шелка
      drawFlowingBettaFin(ctx, caudalPoints, 'rgba(255, 20, 147, 0.75)', 'rgba(155, 77, 255, 0.65)', 'rgba(0, 243, 255, 0.55)', flare, 11);

      // 2. ДЛИННЫЙ ВЕРХНИЙ СПИННОЙ ПЛАВНИК (Dorsal Fin)
      const dorsalPoints = [];
      dorsalPoints.push({ x: spine[2].x, y: spine[2].y });
      const dorsalCount = 7;
      for (let i = 0; i <= dorsalCount; i++) {
        const seg = spine[Math.min(spineSegments - 1, 2 + Math.floor(i * 0.7))];
        const normalAngle = seg.angle - Math.PI / 2;
        const dorsalWave = Math.sin(t * 3.2 - i * 0.7) * (5 + flare * 4);
        const dorsalHeight = (22 + (dorsalCount - i) * 3) * (1 + flare * 0.5);

        dorsalPoints.push({
          x: seg.x + Math.cos(normalAngle) * dorsalHeight + Math.cos(seg.angle + Math.PI) * (i * 4 + dorsalWave),
          y: seg.y + Math.sin(normalAngle) * dorsalHeight + Math.sin(seg.angle + Math.PI) * (i * 4 + dorsalWave)
        });
      }
      dorsalPoints.push({ x: tail.x, y: tail.y });
      drawFlowingBettaFin(ctx, dorsalPoints, 'rgba(155, 77, 255, 0.75)', 'rgba(224, 36, 195, 0.6)', 'rgba(0, 243, 255, 0.5)', flare, 6);

      // 3. НИЖНИЙ ШЛЕЙФОВЫЙ АНАЛЬНЫЙ ПЛАВНИК (Anal Fin)
      const analPoints = [];
      analPoints.push({ x: spine[2].x, y: spine[2].y });
      const analCount = 8;
      for (let i = 0; i <= analCount; i++) {
        const seg = spine[Math.min(spineSegments - 1, 2 + Math.floor(i * 0.7))];
        const normalAngle = seg.angle + Math.PI / 2;
        const analWave = Math.sin(t * 3.0 - i * 0.6) * (6 + flare * 3);
        const analHeight = (25 + (analCount - i) * 3.5) * (1 + flare * 0.45);

        analPoints.push({
          x: seg.x + Math.cos(normalAngle) * analHeight + Math.cos(seg.angle + Math.PI) * (i * 4 + analWave),
          y: seg.y + Math.sin(normalAngle) * analHeight + Math.sin(seg.angle + Math.PI) * (i * 4 + analWave)
        });
      }
      analPoints.push({ x: tail.x, y: tail.y });
      drawFlowingBettaFin(ctx, analPoints, 'rgba(255, 20, 147, 0.8)', 'rgba(155, 77, 255, 0.65)', 'rgba(255, 190, 11, 0.4)', flare, 7);

      // 4. ТОНКИЕ БРЮШНЫЕ ПЛАВНИЧКИ-НИТИ (Ventral Fins, гордость петушка)
      const vNormal = head.angle + Math.PI / 2;
      const vWave = Math.sin(t * 4) * 4;
      ctx.save();
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00f3ff';
      ctx.strokeStyle = '#00f3ff';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(spine[1].x, spine[1].y);
      ctx.quadraticCurveTo(
        spine[1].x + Math.cos(vNormal) * 20 + vWave,
        spine[1].y + Math.sin(vNormal) * 20,
        spine[1].x + Math.cos(vNormal) * (34 + flare * 10) - Math.cos(head.angle) * 10,
        spine[1].y + Math.sin(vNormal) * (34 + flare * 10)
      );
      ctx.stroke();
      ctx.restore();

      // 5. ГРАЦИОЗНОЕ ТЕЛО ПЕТУШКА (Иридесцентная неоновая чешуя)
      ctx.save();
      ctx.shadowBlur = 14;
      ctx.shadowColor = '#e024c3';

      const bodyGrad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
      bodyGrad.addColorStop(0, '#00f3ff');
      bodyGrad.addColorStop(0.35, '#9b4dff');
      bodyGrad.addColorStop(0.7, '#ff1493');
      bodyGrad.addColorStop(1, '#ffbe0b');

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();

      // Верхний контур тела
      const leftPoints = [];
      const rightPoints = [];
      const bodyWidths = [4.5, 7.5, 8.5, 7.5, 6.0, 4.5, 3.2, 2.0];

      for (let i = 0; i < spineSegments; i++) {
        const seg = spine[i];
        const normal = seg.angle + Math.PI / 2;
        const w = bodyWidths[i] * (1 + flare * 0.18);
        leftPoints.push({
          x: seg.x + Math.cos(normal) * w,
          y: seg.y + Math.sin(normal) * w
        });
        rightPoints.push({
          x: seg.x - Math.cos(normal) * w,
          y: seg.y - Math.sin(normal) * w
        });
      }

      // Нос петушка
      const noseX = head.x + Math.cos(head.angle) * 13;
      const noseY = head.y + Math.sin(head.angle) * 13;

      ctx.moveTo(noseX, noseY);
      leftPoints.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(tail.x, tail.y);
      for (let i = rightPoints.length - 1; i >= 0; i--) {
        ctx.lineTo(rightPoints[i].x, rightPoints[i].y);
      }
      ctx.closePath();
      ctx.fill();

      // Кибер-жаберная крышка при распушении (Жабры петушка оттопыриваются!)
      if (flare > 0.2) {
        ctx.strokeStyle = '#ff1493';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const gillX = head.x - Math.cos(head.angle) * 2;
        const gillY = head.y - Math.sin(head.angle) * 2;
        ctx.arc(gillX, gillY, 6 * flare, head.angle - Math.PI/2, head.angle + Math.PI/2);
        ctx.stroke();
      }

      // Глаз петушка
      const eyeNormal = head.angle - Math.PI / 2;
      const eyeX = head.x + Math.cos(head.angle) * 6 + Math.cos(eyeNormal) * 3.5;
      const eyeY = head.y + Math.sin(head.angle) * 6 + Math.sin(eyeNormal) * 3.5;

      if (pet.sleeping) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(eyeX - 2, eyeY);
        ctx.lineTo(eyeX + 2, eyeY);
        ctx.stroke();
      } else {
        // Большой выразительный неоновый глаз
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(eyeX, eyeY, 3.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0a0118';
        ctx.beginPath();
        ctx.arc(eyeX + Math.cos(head.angle)*0.8, eyeY + Math.sin(head.angle)*0.8, 1.8, 0, Math.PI * 2);
        ctx.fill();

        // Неоновый блик в глазу
        ctx.fillStyle = '#00f3ff';
        ctx.fillRect(eyeX + 0.4, eyeY - 1.2, 1.2, 1.2);
      }

      ctx.restore();

      // 6. БОКОВОЙ ГРУДНОЙ ВЕЕРНЫЙ ПЛАВНИК (Быстро трепещет)
      ctx.save();
      const pecAngle = head.angle + Math.PI / 2 + Math.sin(t * 10) * 0.4;
      const pecX = spine[1].x;
      const pecY = spine[1].y;
      ctx.fillStyle = 'rgba(0, 243, 255, 0.45)';
      ctx.beginPath();
      ctx.moveTo(pecX, pecY);
      ctx.lineTo(pecX + Math.cos(pecAngle) * 12, pecY + Math.sin(pecAngle) * 12);
      ctx.lineTo(pecX + Math.cos(pecAngle + 0.5) * 14, pecY + Math.sin(pecAngle + 0.5) * 14);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Главный цикл отрисовки Canvas
    function render() {
      // 1. Неоновый фон аквариума
      const waterGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (pet.sleeping) {
        waterGrad.addColorStop(0, '#030612');
        waterGrad.addColorStop(1, '#010206');
      } else if (pet.cleanliness < 40) {
        waterGrad.addColorStop(0, '#0a1614');
        waterGrad.addColorStop(1, '#050f0c');
      } else {
        waterGrad.addColorStop(0, '#0b0c26');
        waterGrad.addColorStop(0.5, '#060a1d');
        waterGrad.addColorStop(1, '#02040b');
      }
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Легкие световые столбы (неоновые лучи из-под воды)
      ctx.save();
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#00f3ff';
      for(let i=0; i<3; i++) {
        const rx = 80 + i * 140 + Math.sin(Date.now() * 0.001 + i) * 30;
        ctx.beginPath();
        ctx.moveTo(rx, 0);
        ctx.lineTo(rx + 60, 0);
        ctx.lineTo(rx + 110, canvas.height);
        ctx.lineTo(rx + 20, canvas.height);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Неоновые нитевидные водоросли на дне
      ctx.save();
      ctx.shadowBlur = 8;
      ctx.shadowColor = '#00f59b';
      ctx.strokeStyle = 'rgba(0, 245, 155, 0.35)';
      ctx.lineWidth = 3;
      for (let x = 20; x < canvas.width; x += 32) {
        const wave = Math.sin(Date.now() * 0.002 + x) * 15;
        const h = 45 + Math.sin(x) * 15;
        ctx.beginPath();
        ctx.moveTo(x, canvas.height);
        ctx.quadraticCurveTo(x + wave, canvas.height - h / 2, x + wave * 1.5, canvas.height - h);
        ctx.stroke();
      }
      ctx.restore();

      // Пузырьки
      ctx.fillStyle = 'rgba(0, 243, 255, 0.4)';
      bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < -5) {
          b.y = canvas.height + 5;
          b.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Корм (неоновые золотые гранулы)
      foods.forEach((f, index) => {
        f.y += f.speed;
        ctx.save();
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffbe0b';
        ctx.fillStyle = '#ffbe0b';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 3, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        // Поедание корма
        const headDist = Math.hypot(spine[0].x - f.x, spine[0].y - f.y);
        if (headDist < 16) {
          foods.splice(index, 1);
          pet.hunger = Math.min(100, pet.hunger + 18);
          pet.happiness = Math.min(100, pet.happiness + 8);
          audio.soundEat();
          triggerBettaFlare(0.8, 40); // Петушок распушается от восторга
          setMessage('ПЕТУШОК С УДОВОЛЬСТВИЕМ СЪЕЛ КОРМ! (+FOOD)');
          updateUI();
          savePet();
        }

        if (f.y > canvas.height - 8) {
          foods.splice(index, 1);
          pet.cleanliness = Math.max(0, pet.cleanliness - 4);
        }
      });

      // 2. Физика кинематики рыбки-петушка
      const dx = betta.targetX - betta.x;
      const dy = betta.targetY - betta.y;
      const dist = Math.hypot(dx, dy);

      const speedLimit = betta.isFlaring ? 0.8 : (dist > 70 ? 2.2 : 1.3);
      betta.vx += (dx / (dist || 1)) * 0.08;
      betta.vy += (dy / (dist || 1)) * 0.08;
      betta.vx = Math.max(-speedLimit, Math.min(speedLimit, betta.vx * 0.96));
      betta.vy = Math.max(-speedLimit, Math.min(speedLimit, betta.vy * 0.96));

      betta.x += betta.vx;
      betta.y += betta.vy;

      // Голова петушка следует за траекторией
      const targetAngle = Math.atan2(betta.vy, betta.vx);
      let angleDiff = targetAngle - betta.angle;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      betta.angle += angleDiff * 0.06;

      betta.wiggleTime += Math.hypot(betta.vx, betta.vy) * 0.08 + 0.02;

      // Управление распушением (Flare)
      if (betta.flairTimer > 0) {
        betta.flairTimer--;
        betta.flareFactor += (1 - betta.flareFactor) * 0.12;
      } else {
        betta.flareFactor += (0 - betta.flareFactor) * 0.05;
        betta.isFlaring = false;
      }

      // Инверсная кинематика позвоночника (передача изгиба телу)
      spine[0].x = betta.x;
      spine[0].y = betta.y;
      spine[0].angle = betta.angle;

      for (let i = 1; i < spineSegments; i++) {
        const prev = spine[i - 1];
        const cur = spine[i];
        const segAngle = Math.atan2(cur.y - prev.y, cur.x - prev.x);
        cur.angle = segAngle;
        cur.x = prev.x + Math.cos(segAngle) * segmentLength;
        cur.y = prev.y + Math.sin(segAngle) * segmentLength;
      }

      // 3. Отрисовка великолепной рыбки
      drawBettaFish();

      // Значок Zzz во сне
      if (pet.sleeping) {
        ctx.save();
        ctx.fillStyle = '#ffbe0b';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#9b4dff';
        ctx.font = '10px "Press Start 2P"';
        const zFloat = Math.sin(Date.now() * 0.003) * 5;
        ctx.fillText("Zzz...", betta.x - 10, betta.y - 25 + zFloat);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    render();

    /* ========================================================
       4. РЕАКЦИИ, УПРАВЛЕНИЕ И «РАСПУШЕНИЕ» ПЕТУШКА
       ======================================================== */
    function triggerBettaFlare(amount = 1.0, durationFrames = 90) {
      betta.flareFactor = Math.max(betta.flareFactor, amount);
      betta.flairTimer = durationFrames;
      betta.isFlaring = true;
    }

    // Касание/клик по аквариуму — петушок подплывает и распушает плавники
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      if (!pet.sleeping) {
        betta.targetX = clickX;
        betta.targetY = clickY;
        triggerBettaFlare(0.85, 70);
        audio.soundFlare();
        setMessage('ПЕТУШОК КРАСУЕТСЯ И РАСПУШАЕТ ПЛАВНИКИ! // 威嚇と誇示');

        // Пузырьки от пальца
        for(let i=0; i<6; i++) {
          bubbles.push({
            x: clickX + (Math.random()-0.5)*15,
            y: clickY + (Math.random()-0.5)*15,
            r: Math.random() * 3 + 1,
            speed: Math.random() * 1.5 + 0.8
          });
        }
      }
    });

    // 🍙 Кнопка КОРМ
    document.getElementById('feedBtn').onclick = () => {
      if (pet.sleeping) {
        setMessage('ПЕТУШОК СПИТ! НЕ БЕСПОКОЙТЕ // 睡眠中');
        return;
      }
      if (foods.length >= 3) {
        setMessage('НЕ ПЕРЕКАРМЛИВАЙТЕ ПЕТУШКА!');
        return;
      }
      foods.push({
        x: 60 + Math.random() * (canvas.width - 120),
        y: 8,
        speed: Math.random() * 0.5 + 0.5
      });
      audio.soundEat();
      setMessage('БРОШЕНА ГРАНУЛА КОРМА // 餌やり');
    };

    // 🫧 Кнопка ФИЛЬТР
    document.getElementById('cleanBtn').onclick = () => {
      pet.cleanliness = Math.min(100, pet.cleanliness + 35);
      audio.soundClean();
      updateUI();
      savePet();
      setMessage('НЕОНОВЫЙ БИО-ФИЛЬТР ОЧИСТИЛ ВОДУ // 浄化完了');
    };

    // 🪞 Кнопка ЗЕРКАЛО (Любимая игра настоящих петушков!)
    document.getElementById('playBtn').onclick = () => {
      if (pet.sleeping) {
        setMessage('ПЕТУШОК СПИТ // 睡眠中');
        return;
      }
      pet.happiness = Math.min(100, pet.happiness + 25);
      pet.energy = Math.max(0, pet.energy - 10);
      
      triggerBettaFlare(1.0, 130); // Полный королевский веер
      audio.soundFlare();
      updateUI();
      savePet();
      setMessage('ВЫ ПОДНЕСЛИ ЗЕРКАЛО: ПЕТУШОК РАСПУСТИЛ ВСЕ ПЛАВНИКИ! // FLARE!');
    };

    // 💡 Ночной / Дневной неоновый режим
    function applySleepMode(isNight) {
      const crt = document.getElementById('crtScreen');
      if (isNight) {
        crt.classList.add('night-filter');
      } else {
        crt.classList.remove('night-filter');
      }
    }

    document.getElementById('sleepBtn').onclick = () => {
      pet.sleeping = !pet.sleeping;
      applySleepMode(pet.sleeping);
      audio.soundLight();
      savePet();
      if (pet.sleeping) {
        setMessage('НОЧНОЙ НЕОН ВКЛЮЧЕН: ПЕТУШОК ОТДЫХАЕТ // おやすみなさい');
      } else {
        setMessage('ДЕНЬ: ПЕТУШОК СНОВА БОДР И АКТИВЕН // おはよう！');
      }
    };

    // Звук переключатель
    const soundToggle = document.getElementById('soundToggle');
    soundToggle.onclick = () => {
      audio.muted = !audio.muted;
      soundToggle.innerText = audio.muted ? '🔇 MUTE' : '🔊 BGM';
      if (!audio.muted) audio.soundFanfare();
    };

    // Авто-вход при перезагрузке
    window.onload = () => {
      const users = loadUsers();
      const keys = Object.keys(users);
      if (keys.length > 0) {
        login(keys[0]);
      }
    };
  </script>
