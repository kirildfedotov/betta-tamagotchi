<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>電脳金魚 1999 // CYBER-FISH TAMAGOTCHI</title>
  
  <!-- Ретро-шрифты Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0612;
      --case-color: #1a1528;
      --case-border: #3d2a63;
      --neon-pink: #ff2a85;
      --neon-cyan: #00f0ff;
      --neon-yellow: #ffe600;
      --neon-green: #05ffa1;
      --neon-purple: #9d4edd;
      --screen-bg: #031018;
      --crt-glow: rgba(0, 240, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(255, 42, 133, 0.15), transparent 60%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 32px 32px, 32px 32px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* Главный контейнер консоли */
    .tamagotchi-case {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(165deg, #2b1f47 0%, #161026 60%, #0d0818 100%);
      border: 4px solid var(--neon-pink);
      border-radius: 40px 40px 55px 55px;
      padding: 24px 20px 32px;
      box-shadow: 
        0 0 25px rgba(255, 42, 133, 0.4),
        inset 0 2px 4px rgba(255, 255, 255, 0.3),
        inset 0 -8px 16px rgba(0, 0, 0, 0.8),
        0 20px 40px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    /* Верхний декоративный шильдик */
    .brand-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding: 0 8px;
    }

    .brand-title {
      font-size: 11px;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan);
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .brand-title span.kanji {
      font-family: 'DotGothic16', sans-serif;
      font-size: 14px;
      color: var(--neon-pink);
      text-shadow: 0 0 8px var(--neon-pink);
    }

    .top-controls {
      display: flex;
      gap: 8px;
    }

    .mini-btn {
      background: #251838;
      border: 1px solid var(--neon-cyan);
      color: var(--neon-cyan);
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
      transition: all 0.15s;
    }

    .mini-btn:hover {
      background: var(--neon-cyan);
      color: #000;
    }

    /* CRT Экран */
    .screen-bezel {
      background: #050508;
      padding: 14px;
      border-radius: 20px;
      border: 3px solid #3c2a61;
      box-shadow: inset 0 0 15px #000;
      position: relative;
    }

    .crt-screen {
      position: relative;
      background: var(--screen-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #00f0ff55;
      box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.2);
    }

    /* Эффект ЭЛТ-монитора и сканлайнов */
    .crt-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.8;
    }

    .crt-screen::after {
      content: " ";
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at 50% 50%, transparent 65%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 11;
    }

    canvas {
      display: block;
      width: 100%;
      height: 250px;
      cursor: crosshair;
    }

    /* Панель показателей (HUD) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 15px;
      background: rgba(8, 4, 18, 0.7);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid #3d2a63;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-label {
      font-size: 8px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    .stat-bar-outer {
      height: 8px;
      background: #110d1f;
      border: 1px solid #483174;
      border-radius: 4px;
      overflow: hidden;
      padding: 1px;
    }

    .stat-bar-inner {
      height: 100%;
      width: 80%;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px currentColor;
      transition: width 0.3s ease, background 0.3s ease;
      border-radius: 2px;
    }

    /* Инфо-тикер (бегущая строка) */
    .status-ticker {
      font-family: 'DotGothic16', monospace;
      font-size: 13px;
      color: var(--neon-yellow);
      background: #02070c;
      border: 1px dashed #00f0ff44;
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 12px;
      text-align: center;
      text-shadow: 0 0 6px var(--neon-yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* D-PAD и Аркадные кнопки */
    .controls-panel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .action-btn {
      background: linear-gradient(180deg, #321c52 0%, #1f0f35 100%);
      border: 2px solid var(--neon-pink);
      border-radius: 14px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 #120722, 0 0 10px rgba(255, 42, 133, 0.3);
      transition: transform 0.08s, box-shadow 0.08s, filter 0.1s;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #120722, 0 0 15px rgba(255, 42, 133, 0.7);
    }

    .btn-icon {
      font-size: 20px;
      line-height: 1;
    }

    .btn-title {
      font-size: 7px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .btn-clean { border-color: var(--neon-cyan); box-shadow: 0 5px 0 #052636, 0 0 10px rgba(0, 240, 255, 0.3); }
    .btn-clean:active { box-shadow: 0 1px 0 #052636; }

    .btn-play { border-color: var(--neon-green); box-shadow: 0 5px 0 #073322, 0 0 10px rgba(5, 255, 161, 0.3); }
    .btn-play:active { box-shadow: 0 1px 0 #073322; }

    .btn-light { border-color: var(--neon-yellow); box-shadow: 0 5px 0 #3d3405, 0 0 10px rgba(255, 230, 0, 0.3); }
    .btn-light:active { box-shadow: 0 1px 0 #3d3405; }

    /* Окно авторизации / профиля */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(6, 2, 15, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-card {
      width: 100%;
      max-width: 380px;
      background: #140d24;
      border: 3px solid var(--neon-cyan);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
      position: relative;
    }

    .modal-header {
      font-size: 11px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.5;
    }

    .modal-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: #090513;
      border: 1px solid #3f2a68;
      color: #888;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #251347;
      border-color: var(--neon-pink);
      color: var(--neon-pink);
      box-shadow: 0 0 8px rgba(255, 42, 133, 0.4);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 8px;
      color: #9d8abf;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: #080312;
      border: 1px solid var(--neon-purple);
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      outline: none;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
    }

    .form-input:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--neon-pink);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--neon-pink);
      transition: opacity 0.2s;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .auth-error {
      color: #ff3b3b;
      font-size: 8px;
      margin-top: 10px;
      text-align: center;
      line-height: 1.4;
      display: none;
    }

    .hidden {
      display: none !important;
    }

    /* Ночной режим для экрана */
    .night-overlay {
      background: rgba(2, 5, 20, 0.7) !important;
    }
  </style>
</head>
<body>

  <!-- Основной корпус консоли -->
  <div class="tamagotchi-case">
    
    <!-- Шапка консоли -->
    <div class="brand-header">
      <div class="brand-title">
        <span class="kanji">電脳金魚 '99</span>
        <span>NEO-TOKYO V1.0</span>
      </div>
      <div class="top-controls">
        <button id="soundToggle" class="mini-btn">🔊 BGM</button>
        <button id="profileBtn" class="mini-btn">👤 PILOT</button>
      </div>
    </div>

    <!-- ЭЛТ экран -->
    <div class="screen-bezel">
      <div class="crt-screen" id="crtScreen">
        <canvas id="aquariumCanvas" width="400" height="250"></canvas>
      </div>
    </div>

    <!-- Инфострока состояния -->
    <div class="status-ticker" id="statusMessage">
      魚は元気よく泳いでいます // РЫБКА ЧУВСТВУЕТ СЕБЯ ПРЕКРАСНО!
    </div>

    <!-- Шкалы характеристик рыбки -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-label">
          <span>ГОЛОД (FOOD)</span>
          <span id="hungerVal">85%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="hungerBar" style="width: 85%; background: var(--neon-pink);"></div>
        </div>
      </div>
      
      <div class="stat-item">
        <div class="stat-label">
          <span>ЧИСТОТА (AQUA)</span>
          <span id="cleanVal">90%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="cleanBar" style="width: 90%; background: var(--neon-cyan);"></div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-label">
          <span>РАДОСТЬ (JOY)</span>
          <span id="joyVal">70%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="joyBar" style="width: 70%; background: var(--neon-yellow);"></div>
        </div>
      </div>

      <div class="stat-item">
        <div class="stat-label">
          <span>ЭНЕРГИЯ (NRG)</span>
          <span id="energyVal">100%</span>
        </div>
        <div class="stat-bar-outer">
          <div class="stat-bar-inner" id="energyBar" style="width: 100%; background: var(--neon-green);"></div>
        </div>
      </div>
    </div>

    <!-- Кнопки управления -->
    <div class="controls-panel">
      <button class="action-btn" id="feedBtn">
        <span class="btn-icon">🍙</span>
        <span class="btn-title">КОРМ</span>
      </button>

      <button class="action-btn btn-clean" id="cleanBtn">
        <span class="btn-icon">🫧</span>
        <span class="btn-title">ФИЛЬТР</span>
      </button>

      <button class="action-btn btn-play" id="playBtn">
        <span class="btn-icon">🎮</span>
        <span class="btn-title">ИГРА</span>
      </button>

      <button class="action-btn btn-light" id="sleepBtn">
        <span class="btn-icon">💡</span>
        <span class="btn-title">НЕОН</span>
      </button>
    </div>
  </div>

  <!-- Окно авторизации / смены пилота -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <div class="modal-header">
        CYBER-NET SYSTEM v1.99<br>
        <span style="font-size: 8px; color: var(--neon-pink);">[ ТЕРМИНАЛ ИДЕНТИФИКАЦИИ ]</span>
      </div>

      <div class="modal-tabs">
        <button class="tab-btn active" id="tabLogin">ВХОД</button>
        <button class="tab-btn" id="tabRegister">РЕГИСТРАЦИЯ</button>
      </div>

      <form id="authForm">
        <div class="form-group">
          <label class="form-label">ПОЗЫВНОЙ ПИЛОТА (USERNAME)</label>
          <input type="text" class="form-input" id="authUsername" required maxlength="12" autocomplete="off" placeholder="SHINJI_99">
        </div>
        
        <div class="form-group">
          <label class="form-label">КИБЕР-ПАРОЛЬ (PASSWORD)</label>
          <input type="password" class="form-input" id="authPassword" required minlength="3" placeholder="••••">
        </div>

        <button type="submit" class="submit-btn" id="authSubmit">ПОДКЛЮЧИТЬСЯ</button>
        <div class="auth-error" id="authError">ОШИБКА ДОСТУПА</div>
      </form>
    </div>
  </div>

  <script>
    /* ========================================================
       1. 8-БИТНЫЙ АУДИО СИНТЕЗАТОР (WEB AUDIO API)
       ======================================================== */
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playTone(freq, type = 'square', duration = 0.08, rampTo = null) {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (rampTo) {
            osc.frequency.exponentialRampToValueAtTime(rampTo, this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
      }
      soundEat() {
        this.playTone(300, 'triangle', 0.08, 600);
        setTimeout(() => this.playTone(600, 'square', 0.1, 900), 80);
      }
      soundClean() {
        this.playTone(800, 'sine', 0.05, 1200);
        setTimeout(() => this.playTone(1200, 'sine', 0.08, 1600), 60);
      }
      soundPlay() {
        this.playTone(440, 'square', 0.06, 880);
        setTimeout(() => this.playTone(660, 'square', 0.09, 1100), 70);
      }
      soundLight() {
        this.playTone(200, 'sawtooth', 0.15, 100);
      }
      soundLevel() {
        [523, 659, 783, 1046].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'square', 0.1), i * 90);
        });
      }
    }
    const audio = new RetroAudio();

    /* ========================================================
       2. АККАУНТЫ И LOCAL STORAGE
       ======================================================== */
    let currentUser = null;
    let authMode = 'login'; // 'login' или 'register'

    function loadUsers() {
      return JSON.parse(localStorage.getItem('cyberfish_users') || '{}');
    }
    function saveUsers(users) {
      localStorage.setItem('cyberfish_users', JSON.stringify(users));
    }

    const authModal = document.getElementById('authModal');
    const authForm = document.getElementById('authForm');
    const authUsername = document.getElementById('authUsername');
    const authPassword = document.getElementById('authPassword');
    const authError = document.getElementById('authError');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const authSubmit = document.getElementById('authSubmit');
    const profileBtn = document.getElementById('profileBtn');

    tabLogin.onclick = () => {
      authMode = 'login';
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      authSubmit.innerText = 'ПОДКЛЮЧИТЬСЯ';
      authError.style.display = 'none';
    };

    tabRegister.onclick = () => {
      authMode = 'register';
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      authSubmit.innerText = 'ЗАРЕГИСТРИРОВАТЬ';
      authError.style.display = 'none';
    };

    authForm.onsubmit = (e) => {
      e.preventDefault();
      const u = authUsername.value.trim().toUpperCase();
      const p = authPassword.value;
      const users = loadUsers();

      if (authMode === 'register') {
        if (users[u]) {
          showAuthError('ПОЗЫВНОЙ УЖЕ ЗАНЯТ!');
          return;
        }
        users[u] = {
          password: p,
          fishState: createNewFishState()
        };
        saveUsers(users);
        loginUser(u);
      } else {
        if (!users[u] || users[u].password !== p) {
          showAuthError('НЕВЕРНЫЙ ПОЗЫВНОЙ ИЛИ ПАРОЛЬ');
          return;
        }
        loginUser(u);
      }
    };

    function showAuthError(msg) {
      authError.innerText = msg;
      authError.style.display = 'block';
    }

    function loginUser(username) {
      currentUser = username;
      profileBtn.innerText = `👤 ${username.substring(0, 6)}`;
      authModal.classList.add('hidden');
      loadFishState();
      audio.soundLevel();
      setMessage(`ПРИВЕТСТВУЕМ, ПИЛОТ ${username}! // SYSTEM ONLINE`);
    }

    profileBtn.onclick = () => {
      authModal.classList.remove('hidden');
    };

    function createNewFishState() {
      return {
        hunger: 80,
        cleanliness: 90,
        happiness: 75,
        energy: 100,
        level: 1,
        experience: 0,
        sleeping: false,
        lastTick: Date.now()
      };
    }

    function saveFishState() {
      if (!currentUser) return;
      const users = loadUsers();
      if (users[currentUser]) {
        users[currentUser].fishState = {
          hunger: pet.hunger,
          cleanliness: pet.cleanliness,
          happiness: pet.happiness,
          energy: pet.energy,
          level: pet.level,
          experience: pet.experience,
          sleeping: pet.sleeping,
          lastTick: Date.now()
        };
        saveUsers(users);
      }
    }

    function loadFishState() {
      if (!currentUser) return;
      const users = loadUsers();
      if (users[currentUser] && users[currentUser].fishState) {
        const state = users[currentUser].fishState;
        pet.hunger = state.hunger;
        pet.cleanliness = state.cleanliness;
        pet.happiness = state.happiness;
        pet.energy = state.energy;
        pet.level = state.level || 1;
        pet.experience = state.experience || 0;
        pet.sleeping = state.sleeping || false;
        applyNightMode(pet.sleeping);
        updateUI();
      }
    }

    /* ========================================================
       3. СИСТЕМА ТАМАГОЧИ И ЛОГИКА
       ======================================================== */
    const pet = {
      hunger: 80,
      cleanliness: 85,
      happiness: 70,
      energy: 95,
      level: 1,
      experience: 0,
      sleeping: false
    };

    const statusMessage = document.getElementById('statusMessage');
    function setMessage(text) {
      statusMessage.innerText = text;
    }

    function updateUI() {
      document.getElementById('hungerVal').innerText = `${Math.round(pet.hunger)}%`;
      document.getElementById('cleanVal').innerText = `${Math.round(pet.cleanliness)}%`;
      document.getElementById('joyVal').innerText = `${Math.round(pet.happiness)}%`;
      document.getElementById('energyVal').innerText = `${Math.round(pet.energy)}%`;

      document.getElementById('hungerBar').style.width = `${pet.hunger}%`;
      document.getElementById('cleanBar').style.width = `${pet.cleanliness}%`;
      document.getElementById('joyBar').style.width = `${pet.happiness}%`;
      document.getElementById('energyBar').style.width = `${pet.energy}%`;
    }

    // Периодическое изменение параметров
    setInterval(() => {
      if (!currentUser) return;

      if (!pet.sleeping) {
        pet.hunger = Math.max(0, pet.hunger - 0.7);
        pet.cleanliness = Math.max(0, pet.cleanliness - 0.4);
        pet.happiness = Math.max(0, pet.happiness - 0.5);
        pet.energy = Math.max(0, pet.energy - 0.3);
      } else {
        // Во сне энергия растет, голод уменьшается медленно
        pet.energy = Math.min(100, pet.energy + 2);
        pet.hunger = Math.max(0, pet.hunger - 0.2);
      }

      // Случайное событие загрязнения
      if (Math.random() < 0.08 && pet.cleanliness < 70) {
        addDebris();
      }

      // Состояния самочувствия
      if (pet.hunger < 25) {
        setMessage('РЫБКА ОЧЕНЬ ГОЛОДНА! // 魚はお腹が空いています');
      } else if (pet.cleanliness < 25) {
        setMessage('ВОДА ЗАГРЯЗНЕНА! ВКЛЮЧИТЕ ОЧИСТКУ // 水が汚れています');
      }

      updateUI();
      saveFishState();
    }, 2500);

    /* ========================================================
       4. CANVAS ДВИЖОК: КИБЕР-АКВАРИУМ И РЫБКА
       ======================================================== */
    const canvas = document.getElementById('aquariumCanvas');
    const ctx = canvas.getContext('2d');

    // Разрешение Canvas для ретро-четкости
    canvas.width = 400;
    canvas.height = 250;

    let foods = [];
    let bubbles = [];
    let debrisList = [];

    // Создаем неоновые пузырьки
    for(let i=0; i<15; i++) {
      bubbles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 0.8 + 0.3
      });
    }

    function addDebris() {
      if (debrisList.length < 8) {
        debrisList.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: Math.random() * (canvas.height - 40) + 20,
          size: Math.random() * 3 + 2
        });
      }
    }

    const fish = {
      x: 200,
      y: 125,
      targetX: 200,
      targetY: 125,
      vx: 0,
      vy: 0,
      angle: 0,
      wiggle: 0,
      baseColor: '#00f0ff',
      glowColor: 'rgba(0, 240, 255, 0.6)'
    };

    // Случайное блуждание рыбки
    setInterval(() => {
      if (pet.sleeping) {
        fish.targetX = canvas.width / 2;
        fish.targetY = canvas.height * 0.7;
        return;
      }
      
      if (foods.length > 0) {
        // Плыть к ближайшей еде
        fish.targetX = foods[0].x;
        fish.targetY = foods[0].y;
      } else {
        fish.targetX = 40 + Math.random() * (canvas.width - 80);
        fish.targetY = 40 + Math.random() * (canvas.height - 80);
      }
    }, 1800);

    function drawPixelFish(x, y, angle, wiggle, isSleeping) {
      ctx.save();
      ctx.translate(x, y);
      
      // Разворот влево/вправо в зависимости от направления
      const facingLeft = Math.cos(angle) < 0;
      ctx.scale(facingLeft ? -1 : 1, 1);

      // Неоновое свечение кибер-рыбки
      ctx.shadowBlur = 12;
      ctx.shadowColor = pet.happiness > 60 ? '#00f0ff' : '#ff2a85';

      const bodyColor = pet.cleanliness < 35 ? '#809988' : '#00f0ff';
      const finColor = pet.hunger < 30 ? '#ff85a1' : '#ff2a85';

      // Хвостовой плавник (колеблется при плавании)
      const tailWiggle = Math.sin(wiggle) * 4;
      ctx.fillStyle = finColor;
      ctx.beginPath();
      ctx.moveTo(-16, 0);
      ctx.lineTo(-26 + tailWiggle, -10);
      ctx.lineTo(-22 + tailWiggle, 0);
      ctx.lineTo(-26 + tailWiggle, 10);
      ctx.closePath();
      ctx.fill();

      // Верхний кибер-плавник
      ctx.fillStyle = '#ffe600';
      ctx.beginPath();
      ctx.moveTo(-6, -6);
      ctx.lineTo(2, -14);
      ctx.lineTo(8, -6);
      ctx.closePath();
      ctx.fill();

      // Тело рыбки (пиксельная стилизация в виде полигона)
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.moveTo(18, 0); // нос
      ctx.lineTo(6, -9);
      ctx.lineTo(-14, -6);
      ctx.lineTo(-16, 0);
      ctx.lineTo(-14, 6);
      ctx.lineTo(6, 9);
      ctx.closePath();
      ctx.fill();

      // Глаз
      if (isSleeping) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(8, -2);
        ctx.lineTo(13, -2);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#fff';
        ctx.fillRect(8, -4, 5, 5);
        ctx.fillStyle = '#050510';
        ctx.fillRect(10, -3, 2, 3);
      }

      // Неоновые чешуйки/полосы кибер-дизайна
      ctx.fillStyle = '#ffe600';
      ctx.fillRect(-2, -4, 2, 8);
      ctx.fillRect(-8, -3, 2, 6);

      ctx.restore();
    }

    function render() {
      // Очистка и отрисовка кибер-воды с градиентом
      const waterGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (pet.sleeping) {
        waterGrad.addColorStop(0, '#030814');
        waterGrad.addColorStop(1, '#020308');
      } else if (pet.cleanliness < 40) {
        waterGrad.addColorStop(0, '#101c18');
        waterGrad.addColorStop(1, '#06130b');
      } else {
        waterGrad.addColorStop(0, '#04162e');
        waterGrad.addColorStop(1, '#020914');
      }
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Неоновые водоросли на дне
      ctx.shadowBlur = 6;
      ctx.shadowColor = '#05ffa1';
      ctx.fillStyle = '#05ffa155';
      for (let i = 20; i < canvas.width; i += 45) {
        const h = Math.sin(Date.now() * 0.002 + i) * 8 + 35;
        ctx.beginPath();
        ctx.moveTo(i, canvas.height);
        ctx.quadraticCurveTo(i + 10, canvas.height - h / 2, i + Math.sin(Date.now()*0.003 + i)*6, canvas.height - h);
        ctx.lineTo(i + 4, canvas.height);
        ctx.fill();
      }

      // Пузырьки воздуха
      ctx.shadowBlur = 4;
      ctx.shadowColor = '#00f0ff';
      ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
      bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < -5) {
          b.y = canvas.height + 5;
          b.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Грязь/водоросли при низком фильтре
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#486842';
      debrisList.forEach(d => {
        ctx.fillRect(d.x, d.y, d.size, d.size);
      });

      // Отрисовка еды
      foods.forEach((food, index) => {
        food.y += food.speed;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ffe600';
        ctx.fillStyle = '#ffe600';
        ctx.fillRect(food.x - 2, food.y - 2, 5, 5);

        // Проверка поедания рыбой
        const dist = Math.hypot(fish.x - food.x, fish.y - food.y);
        if (dist < 18) {
          foods.splice(index, 1);
          pet.hunger = Math.min(100, pet.hunger + 15);
          pet.happiness = Math.min(100, pet.happiness + 5);
          audio.soundEat();
          setMessage('ВКУСНО! 魚は満足しています (+FOOD)');
          updateUI();
          saveFishState();
        }

        // Удаление со дна
        if (food.y > canvas.height - 10) {
          foods.splice(index, 1);
          pet.cleanliness = Math.max(0, pet.cleanliness - 3);
          addDebris();
        }
      });

      // Плавное движение рыбки
      const dx = fish.targetX - fish.x;
      const dy = fish.targetY - fish.y;
      fish.vx += dx * 0.002;
      fish.vy += dy * 0.002;
      fish.vx *= 0.94;
      fish.vy *= 0.94;
      fish.x += fish.vx;
      fish.y += fish.vy;

      fish.angle = Math.atan2(fish.vy, fish.vx);
      fish.wiggle += Math.hypot(fish.vx, fish.vy) * 0.8 + 0.15;

      drawPixelFish(fish.x, fish.y, fish.angle, fish.wiggle, pet.sleeping);

      // Иконка спящей рыбки "Zzz"
      if (pet.sleeping) {
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#9d4edd';
        ctx.fillStyle = '#ffe600';
        ctx.font = '10px "Press Start 2P"';
        const zOffset = Math.sin(Date.now() * 0.004) * 4;
        ctx.fillText("Zzz...", fish.x + 10, fish.y - 15 + zOffset);
      }

      requestAnimationFrame(render);
    }

    render();

    /* ========================================================
       5. УПРАВЛЕНИЕ И ИНТЕРАКТИВНОСТЬ
       ======================================================== */
    // Клик по аквариуму — пустить пузыри и направить рыбку
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

      if (!pet.sleeping) {
        fish.targetX = clickX;
        fish.targetY = clickY;
        audio.playTone(800, 'sine', 0.04);
        
        // Создать всплеск пузырей
        for(let i=0; i<6; i++) {
          bubbles.push({
            x: clickX + (Math.random()-0.5)*20,
            y: clickY + (Math.random()-0.5)*20,
            r: Math.random() * 3 + 1,
            speed: Math.random() * 1.5 + 0.8
          });
        }
      }
    });

    // 🍙 Кнопка «КОРМ»
    document.getElementById('feedBtn').onclick = () => {
      if (pet.sleeping) {
        setMessage('РЫБКА СПИТ! НЕ БЕСПОКОЙТЕ // 魚は寝ています');
        return;
      }
      if (foods.length >= 4) {
        setMessage('СЛИШКОМ МНОГО КОРМА В ВОДЕ!');
        return;
      }
      foods.push({
        x: 40 + Math.random() * (canvas.width - 80),
        y: 10,
        speed: Math.random() * 0.6 + 0.6
      });
      audio.soundEat();
      setMessage('КОРМ ДОБАВЛЕН // 餌を与えました');
    };

    // 🫧 Кнопка «ФИЛЬТР»
    document.getElementById('cleanBtn').onclick = () => {
      pet.cleanliness = Math.min(100, pet.cleanliness + 30);
      debrisList = [];
      audio.soundClean();
      updateUI();
      saveFishState();
      setMessage('НЕОНОВЫЙ ФИЛЬТР ОЧИСТИЛ ВОДУ // 浄化完了');
    };

    // 🎮 Кнопка «ИГРА»
    document.getElementById('playBtn').onclick = () => {
      if (pet.sleeping) {
        setMessage('РЫБКА СПИТ! // 睡眠中');
        return;
      }
      pet.happiness = Math.min(100, pet.happiness + 20);
      pet.energy = Math.max(0, pet.energy - 8);
      
      // Рыбка делает забавное сальто-ускорение
      fish.vx = (Math.random() - 0.5) * 12;
      fish.vy = -6;
      audio.soundPlay();
      updateUI();
      saveFishState();
      setMessage('ВЫ ПОИГРАЛИ С РЫБКОЙ! РАДОСТЬ +20 // 楽しい！');
    };

    // 💡 Кнопка «НЕОН / СОН»
    function applyNightMode(isNight) {
      const crt = document.getElementById('crtScreen');
      if (isNight) {
        crt.classList.add('night-overlay');
      } else {
        crt.classList.remove('night-overlay');
      }
    }

    document.getElementById('sleepBtn').onclick = () => {
      pet.sleeping = !pet.sleeping;
      applyNightMode(pet.sleeping);
      audio.soundLight();
      saveFishState();
      if (pet.sleeping) {
        setMessage('НОЧНОЙ НЕОН ВКЛЮЧЕН: РЫБКА ОТДЫХАЕТ // おやすみ');
      } else {
        setMessage('ДНЕВНОЙ РЕЖИМ АКТИВИРОВАН // おはよう！');
      }
    };

    // Звук переключатель
    const soundToggle = document.getElementById('soundToggle');
    soundToggle.onclick = () => {
      audio.muted = !audio.muted;
      soundToggle.innerText = audio.muted ? '🔇 MUTE' : '🔊 BGM';
      if (!audio.muted) audio.soundLevel();
    };

    // Автоматическая проверка: если уже заходили, восстанавливаем сессию
    window.onload = () => {
      const users = loadUsers();
      const userKeys = Object.keys(users);
      if (userKeys.length > 0) {
        loginUser(userKeys[0]);
      }
    };
  </script>
</body>
